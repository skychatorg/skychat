name: Docker build CI

on:
    push:
        branches: ['master']
    pull_request:
        branches: ['master']

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v3
            - name: Use Node.js 22.x
              uses: actions/setup-node@v3
              with:
                  node-version: 22.x
                  cache: 'npm'
            - run: npm ci --ignore-scripts
            # Boot from the .env that setup builds out of the template, exactly like a fresh install
            - run: npm run setup
            - run: docker compose up -d
            - run: node test/smoke/boot.mjs http://localhost:8081
            - name: Show container state on failure
              if: failure()
              run: docker compose ps -a && docker compose logs --tail=50
